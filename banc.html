<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Boîte — banc d'essai de la scansion</title>
    <style>
      :root {
        color-scheme: dark;
        --fond: #14110f;
        --encre: #efe6d8;
        --sourdine: #8a7f70;
        --accent: #d9a441;
      }
      body {
        margin: 0;
        padding: 2rem clamp(1rem, 4vw, 3rem);
        background: var(--fond);
        color: var(--encre);
        font: 15px/1.5 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      }
      h1 {
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin: 0 0 0.25rem;
      }
      p.chapeau {
        color: var(--sourdine);
        margin: 0 0 1.5rem;
        max-width: 62ch;
      }
      #cas {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 1.5rem;
      }
      button {
        font: inherit;
        color: var(--encre);
        background: #221d19;
        border: 1px solid #3a322b;
        border-radius: 2px;
        padding: 0.5rem 0.9rem;
        cursor: pointer;
      }
      button:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .colonnes {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 20rem);
        gap: 2rem;
        align-items: start;
      }
      @media (max-width: 720px) {
        .colonnes {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      #detail {
        color: var(--sourdine);
        margin-bottom: 0.75rem;
        min-height: 1.5em;
      }
      #total {
        font-size: clamp(2.5rem, 9vw, 5rem);
        line-height: 1;
        font-variant-numeric: tabular-nums;
        margin-bottom: 1rem;
      }
      #total.final {
        color: var(--accent);
      }
      #journal {
        height: 20rem;
        overflow-y: auto;
        border-top: 1px solid #3a322b;
        padding-top: 0.75rem;
      }
      .coup {
        color: var(--sourdine);
      }
      .coup.accent {
        color: var(--encre);
      }
      #reglages label {
        display: grid;
        grid-template-columns: 1fr;
        gap: 0.15rem;
        margin-bottom: 0.9rem;
        font-size: 13px;
      }
      #reglages span {
        color: var(--sourdine);
      }
      #reglages output {
        color: var(--accent);
        font-size: 12px;
      }
      input[type='range'] {
        width: 100%;
        accent-color: var(--accent);
      }
    </style>
  </head>
  <body>
    <h1>Banc d'essai — le comptage scandé</h1>
    <p class="chapeau">
      Régler les chiffres de <code>src/presets/scansion.ts</code> à l'oreille, sur les cas
      extrêmes mesurés. Ce n'est pas le jeu : il n'y a rien à jouer ici.
    </p>

    <div id="cas"></div>

    <div class="colonnes">
      <section>
        <div id="detail"></div>
        <div id="total">0</div>
        <div id="journal"></div>
      </section>
      <section>
        <div id="reglages"></div>
        <button id="reinitialiser">remettre les valeurs des presets</button>
      </section>
    </div>

    <script type="module" src="/src/rendu/banc.ts"></script>
  </body>
</html>
